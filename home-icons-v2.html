<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icônes Retour accueil</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05080f; --surface:rgba(255,255,255,.035); --ice:#eef4ff; --mist:#9aa6c4; --mist-dim:#5d6886;
    --g1:#2b3fdb; --g2:#7c2ae8; --g3:#1b2a8f; --cyan:#4fd1ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ice); font-family:Manrope,system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  body{ min-height:100vh; padding:clamp(24px,5vw,72px) 16px; }
  .wrap{ max-width:1280px; margin:0 auto; }
  h1{ font-weight:800; font-size:clamp(1.5rem,1rem + 2.4vw,2.75rem); letter-spacing:-.015em; margin:0 0 8px; }
  h1 span{ background:linear-gradient(115deg,var(--g1),var(--g2),var(--g3),var(--g2),var(--g1)); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:grad 7s linear infinite; }
  @keyframes grad{ to{ background-position:300% 50%; } }
  p.lede{ color:var(--mist); margin:0 0 40px; max-width:60ch; line-height:1.6; font-size:.95rem; }
  .grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
  .card{ position:relative; background:var(--surface); backdrop-filter:blur(14px); border-radius:20px; padding:26px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:16px; transition:transform .45s cubic-bezier(.34,1.56,.64,1), background .35s; }
  .card:hover{ transform:translateY(-6px); background:rgba(255,255,255,.06); }
  .num{ position:absolute; top:12px; left:14px; font-family:'JetBrains Mono',monospace; font-size:.66rem; color:var(--mist-dim); }
  .stage{ width:92px; height:92px; border-radius:28px; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,rgba(43,63,219,.16),rgba(124,42,232,.12)); animation:float 4s ease-in-out infinite; }
  .card:nth-child(2n) .stage{ animation-delay:-1.3s; } .card:nth-child(3n) .stage{ animation-delay:-2.6s; }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .stage svg{ width:44px; height:44px; overflow:visible; transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  .card:hover .stage svg{ transform:scale(1.12) rotate(-4deg); }
  .row{ display:flex; gap:14px; align-items:center; }
  .row .mini{ width:21px; height:21px; }
  .row .mini.dim{ opacity:.65; }
  .name{ font-weight:700; font-size:.9rem; text-align:center; }
  .desc{ color:var(--mist); font-size:.74rem; text-align:center; line-height:1.5; margin-top:-8px; }
  .tag{ font-family:'JetBrains Mono',monospace; font-size:.62rem; color:var(--mist-dim); }
  @media (max-width:1440px){ .grid{ gap:14px; } }
  @media (max-width:1170px){ .grid{ grid-template-columns:repeat(4,1fr); } }
  .grid{ grid-template-columns:repeat(6,1fr); } @media (max-width:1440px){ .grid{ grid-template-columns:repeat(4,1fr); } }
  @media (max-width:980px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:768px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:375px){ .grid{ grid-template-columns:1fr; } }
  @media (min-width:2560px){ .wrap{ max-width:1800px; } .stage{ width:120px; height:120px; } .stage svg{ width:58px; height:58px; } }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style></head>
<body><div class="wrap">
  <h1>12 icônes <span>retour à l'accueil</span></h1>
  <p class="lede">Toutes en SVG 24×24, trait blanc 2px à bouts ronds, prêtes à remplacer l'icône actuelle dans <code>.brand-mark</code>. Sous chaque carte : aperçu à la taille réelle (21px), à 100% puis à 65% comme sur mobile.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
var S='fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
var icons=[
 ["Maison + flèche retour","Flèche courbe qui revient vers la maison : retour explicite.",
  '<path d="M8.5 11 14 6.2a2 2 0 0 1 2.6 0L22 11"/><path d="M10 10v8a2 2 0 0 0 2 2h6.5a2 2 0 0 0 2-2v-8"/><path d="M7 14.5H2.5"/><path d="M5 12 2.5 14.5 5 17"/>'],
 ["Porte d\'entrée","Façade arrondie avec porte entrouverte : « on rentre ».",
  '<path d="M4 20.5V10.8a2 2 0 0 1 .7-1.5l6-5.2a2 2 0 0 1 2.6 0l6 5.2a2 2 0 0 1 .7 1.5v9.7"/><path d="M2.5 20.5h19"/><path d="M9.5 20.5v-6.3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6.3"/><circle cx="13.3" cy="17" r=".5"/>'],
 ["Toit chevron","Juste le toit en chevron arrondi + sol : ultra minimal.",
  '<path d="M3 13 10.6 5.6a2 2 0 0 1 2.8 0L21 13"/><path d="M7 19.5h10"/>'],
 ["Maison dans un rond","Pastille ronde, maison au centre, façon bouton d\'app.",
  '<circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.2 11 9.3a1.5 1.5 0 0 1 2 0l3.2 2.9"/><path d="M9.2 11.3v4a1 1 0 0 0 1 1h3.6a1 1 0 0 0 1-1v-4"/>'],
 ["Flèche maison","Maison couchée en forme de flèche vers la gauche : « retour ».",
  '<path d="M2.5 12 8.4 6.4a1.5 1.5 0 0 1 1-.4H19.5a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H9.4a1.5 1.5 0 0 1-1-.4z"/><path d="M13.5 18v-3.5a1.5 1.5 0 0 1 3 0V18"/>'],
 ["Boussole home","Aiguille de boussole qui pointe vers une mini-maison.",
  '<circle cx="12" cy="12" r="9.5"/><path d="M12 7.5 14.5 14 12 12.8 9.5 14z"/><path d="M10.5 18.2 12 17l1.5 1.2"/>'],
 ["Pin localisation","Marqueur de carte avec maison : « retour à la base ».",
  '<path d="M12 21.5s-7-6.1-7-11.5a7 7 0 0 1 14 0c0 5.4-7 11.5-7 11.5z"/><path d="M9 10.2 11.2 8.3a1.2 1.2 0 0 1 1.6 0L15 10.2"/><path d="M10 9.6V12.5h4V9.6"/>'],
 ["Grille app / home","4 tuiles arrondies, celle en haut à gauche = maison.",
  '<rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/><path d="M5.6 7.6 7 6.4 8.4 7.6"/>'],
 ["Maison + point","Maison épurée avec un point lumineux à la place de la porte.",
  '<path d="M3.5 11 10.7 4.7a2 2 0 0 1 2.6 0L20.5 11"/><path d="M5.5 9.5v8a3 3 0 0 0 3 3h7a3 3 0 0 0 3-3v-8"/><circle cx="12" cy="15.5" r="1.4" fill="#fff" stroke="none"/>'],
 ["Maison + flèche circulaire","Flèche qui tourne autour de la maison : « revenir au début ».",
  '<path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V7h-3.5"/><path d="M8.3 12.3 11 10a1.5 1.5 0 0 1 2 0l2.7 2.3"/><path d="M9.5 11.5v3.5a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-3.5"/>'],
 ["Maison ligne unique","Contour d\'un seul trait très arrondi, toit en arc.",
  '<path d="M4.5 20.5V11.5C4.5 7.4 7.9 4 12 4s7.5 3.4 7.5 7.5v9"/><path d="M3 20.5h18"/><path d="M10 20.5v-3.2a2 2 0 0 1 4 0v3.2"/>'],
 ["Maison + étoile","Maison avec petite étincelle : accueil « premium ».",
  '<path d="M3.5 11.5 10.7 5.2a2 2 0 0 1 2.6 0l7.2 6.3"/><path d="M5.5 10v8a2.5 2.5 0 0 0 2.5 2.5h8A2.5 2.5 0 0 0 18.5 18v-8"/><path d="M12 12.3l.8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8z"/>']
];
var g=document.getElementById('grid');
icons.forEach(function(ic,i){
  var svg='<svg viewBox="0 0 24 24" '+S+'>'+ic[2]+'</svg>';
  var el=document.createElement('div'); el.className='card';
  el.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><div class="stage">'+svg+'</div>'
   +'<div class="name">'+ic[0]+'</div><div class="desc">'+ic[1]+'</div>'
   +'<div class="row"><span class="tag">21px</span>'+svg.replace('<svg','<svg class="mini"')+svg.replace('<svg','<svg class="mini dim"')+'<span class="tag">65%</span></div>';
  g.appendChild(el);
});
</script>
</body></html>
